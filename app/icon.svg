    <ellipse cx="-3.5" cy="-10" rx="3" ry="4"/>
    <ellipse cx="3.5" cy="-10" rx="3" ry="4"/>
    <ellipse cx="9" cy="-5" rx="3" ry="4" transform="rotate(20 9 -5)"/>
  </g>
</svg>
